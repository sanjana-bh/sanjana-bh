name: Update Streak Stats Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak SVG
        run: |
          cp assets/streak-template.svg assets/streak-stats.svg

          sed -i "s/{{TOTAL_CONTRIBUTIONS}}/1247/g" assets/streak-stats.svg
          sed -i "s/{{START_DATE}}/Nov 5, 2024/g" assets/streak-stats.svg
          sed -i "s/{{END_DATE}}/$(date +'%b %d, %Y')/g" assets/streak-stats.svg
          sed -i "s/{{CURRENT_STREAK}}/9/g" assets/streak-stats.svg
          sed -i "s/{{CURRENT_DATE}}/$(date +'%b %d, %Y')/g" assets/streak-stats.svg
          sed -i "s/{{LONGEST_STREAK}}/67/g" assets/streak-stats.svg
          sed -i "s/{{LONGEST_START}}/Nov 5, 2024/g" assets/streak-stats.svg
          sed -i "s/{{LONGEST_END}}/Dec 31, 2024/g" assets/streak-stats.svg

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/streak-stats.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update streak stats ($(date +'%Y-%m-%d')) [skip ci]"
          git push origin HEAD
