name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate Snake Contribution Graph
        uses: platane/snk@v3
        with:
          github_user_name: sanjana-bh
          outputs: |
            assets/snake-contribution-graph-dark.svg?color_snake=C9788E&color_dots=111827,C9788E,D49AAA,E3A8B7
          
      - name: Commit and push generated SVGs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/snake-contribution-graph-dark.svg
          git diff --staged --quiet || git commit -m "🐍 Update snake contribution graph [automated]"
          git push
