name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger
  push:
    branches:
      - main              # Also runs when you push to main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: Generate Pac-Man Contribution Graph
        uses: github-user-contribution/pacman-contribution-graph@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          output_only: false
          user_name: Sanjana Bhardwaj
          text_color: "0EA5E9"
          
      - name: Commit and push generated SVGs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Create output directory if it doesn't exist
          mkdir -p output
          
          # Move generated files to output directory
          if [ -f "pacman-contribution-graph.svg" ]; then
            cp pacman-contribution-graph.svg output/pacman-contribution-graph.svg
          fi
          if [ -f "pacman-contribution-graph-dark.svg" ]; then
            cp pacman-contribution-graph-dark.svg output/pacman-contribution-graph-dark.svg
          fi
          
          git add output/
          git commit -m "🎮 Update Pac-Man contribution graph [automated]" || echo "No changes to commit"
          git push
