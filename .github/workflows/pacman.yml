name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger
  push:
    branches:
      - main              # Also runs when you push to main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate Pac-Man Contribution Graph
        uses: platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/pacman-contribution-graph.svg?color_snake=0EA5E9&color_dots=0EA5E9,38BDF8,2563EB,0EA5E9,38BDF8
            output/pacman-contribution-graph-dark.svg?color_snake=0EA5E9&color_dots=07131F,10253A,0EA5E9,2563EB,38BDF8
          
      - name: Commit and push generated SVGs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add and commit the generated files
          git add output/
          git diff --staged --quiet || git commit -m "🎮 Update Pac-Man contribution graph [automated]"
          git push
