<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 495 185' width='495px' height='185px'>
  <style>
    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    @keyframes fireDance {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
  </style>

  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0F172A'/>
      <stop offset='100%' stop-color='#1A1528'/>
    </linearGradient>

    <linearGradient id='primaryGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#C75D74'>
        <animate attributeName='stop-color' values='#C75D74;#E6A4B4;#C75D74' dur='4s' repeatCount='indefinite'/>
      </stop>
      <stop offset='100%' stop-color='#A8556E'>
        <animate attributeName='stop-color' values='#A8556E;#C75D74;#A8556E' dur='4s' repeatCount='indefinite'/>
      </stop>
    </linearGradient>

    <linearGradient id='fireGrad' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#C75D74'/>
      <stop offset='100%' stop-color='#E6A4B4'/>
    </linearGradient>

    <filter id='glow'>
      <feGaussianBlur stdDeviation='3'/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in='SourceGraphic'/>
      </feMerge>
    </filter>

    <clipPath id='outer_rectangle'>
      <rect width='495' height='185' rx='12'/>
    </clipPath>
  </defs>

  <g clip-path='url(#outer_rectangle)'>
    <rect width='495' height='185' fill='url(#bgGrad)'/>
    <rect x='1' y='1' width='493' height='183' rx='11' fill='none' stroke='url(#primaryGrad)' stroke-width='1' opacity='0.2'>
      <animate attributeName='opacity' values='0.15;0.25;0.15' dur='3s' repeatCount='indefinite'/>
    </rect>

    <line x1='165' y1='20' x2='165' y2='170' stroke='#C75D74' stroke-width='0.5' opacity='0.08'/>
    <line x1='330' y1='20' x2='330' y2='170' stroke='#C75D74' stroke-width='0.5' opacity='0.08'/>

    <!-- LEFT: TOTAL CONTRIBUTIONS -->
    <text x='82.5' y='28' text-anchor='middle' fill='#94A3B8' font-family='"Segoe UI", sans-serif' font-weight='500' font-size='11px' letter-spacing='2'>
      TOTAL CONTRIBUTIONS
    </text>
    <text x='82.5' y='72' text-anchor='middle' fill='url(#primaryGrad)' font-family='"Segoe UI", sans-serif' font-weight='700' font-size='36px' letter-spacing='1'>
      {{TOTAL_CONTRIBUTIONS}}
    </text>
    <text x='82.5' y='110' text-anchor='middle' fill='#64748B' font-family='"Segoe UI", sans-serif' font-weight='300' font-size='9px' letter-spacing='1'>
      {{START_DATE}} — {{END_DATE}}
    </text>
    <rect x='42' y='140' width='81' height='2' fill='#1E293B' rx='1'/>
    <rect x='42' y='140' width='65' height='2' fill='url(#primaryGrad)' rx='1'>
      <animate attributeName='width' values='50;65;55;65' dur='4s' repeatCount='indefinite'/>
    </rect>

    <!-- CENTER: CURRENT STREAK -->
    <g transform='translate(247.5, 16)' filter='url(#glow)'>
      <path d='M 0 0 C 0 0 2 5 2 8 C 2 11 0 14 -2.5 14 C -5 14 -7 11 -7 8 L -6.5 7 C -9 10 -10.5 14 -10.5 18 C -10.5 23 -5.5 27 0 27 C 5.5 27 10.5 23 10.5 18 C 10.5 11 6 5 0 0 Z' fill='url(#fireGrad)' opacity='0.9'>
        <animateTransform attributeName='transform' type='rotate' values='0 0 14;-2 0 14;2 0 14;0 0 14' dur='2s' repeatCount='indefinite'/>
      </path>
    </g>
    <text x='247.5' y='20' text-anchor='middle' fill='#E6A4B4' font-family='"Segoe UI", sans-serif' font-weight='600' font-size='11px' letter-spacing='2'>
      CURRENT STREAK
    </text>
    <circle cx='247.5' cy='83' r='40' fill='none' stroke='url(#primaryGrad)' stroke-width='2.5' opacity='0.1'>
      <animate attributeName='opacity' values='0.08;0.15;0.08' dur='2s' repeatCount='indefinite'/>
    </circle>
    <circle cx='247.5' cy='83' r='40' fill='none' stroke='url(#primaryGrad)' stroke-width='2.5' stroke-dasharray='251' stroke-dashoffset='251' opacity='0.5'>
      <animate attributeName='stroke-dashoffset' from='251' to='0' dur='2s' fill='freeze'/>
      <animate attributeName='opacity' values='0.3;0.6;0.3' dur='2s' repeatCount='indefinite'/>
    </circle>
    <text x='247.5' y='85' text-anchor='middle' fill='#F8FAFC' font-family='"Segoe UI", sans-serif' font-weight='700' font-size='36px' letter-spacing='1'>
      {{CURRENT_STREAK}}
      <animate attributeName='font-size' values='36;39;36' dur='2s' repeatCount='indefinite'/>
    </text>
    <text x='247.5' y='128' text-anchor='middle' fill='#64748B' font-family='"Segoe UI", sans-serif' font-weight='300' font-size='9px' letter-spacing='1'>
      {{CURRENT_DATE}}
    </text>

    <!-- RIGHT: LONGEST STREAK -->
    <text x='412.5' y='28' text-anchor='middle' font-size='16' filter='url(#glow)'>
      🏆
      <animateTransform attributeName='transform' type='scale' values='1;1.1;1' dur='2s' repeatCount='indefinite'/>
    </text>
    <text x='412.5' y='28' text-anchor='middle' fill='#94A3B8' font-family='"Segoe UI", sans-serif' font-weight='500' font-size='11px' letter-spacing='2'>
      LONGEST STREAK
    </text>
    <text x='412.5' y='72' text-anchor='middle' fill='url(#primaryGrad)' font-family='"Segoe UI", sans-serif' font-weight='700' font-size='36px' letter-spacing='1'>
      {{LONGEST_STREAK}}
    </text>
    <text x='412.5' y='110' text-anchor='middle' fill='#64748B' font-family='"Segoe UI", sans-serif' font-weight='300' font-size='9px' letter-spacing='1'>
      {{LONGEST_START}} — {{LONGEST_END}}
    </text>

    <!-- BOTTOM -->
    <text x='247.5' y='172' text-anchor='middle' fill='#64748B' font-family='"Segoe UI", sans-serif' font-weight='300' font-size='7px' letter-spacing='3'>
      ◆ ◆ ◆  CONTRIBUTION STREAK  ◆ ◆ ◆
    </text>
  </g>
</svg>
