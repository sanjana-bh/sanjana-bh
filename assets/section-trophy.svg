<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48">
  <defs>
    <!-- Brand Palette Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#FF79BF;#49C9EA;#FF2D95" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF79BF">
        <animate attributeName="stop-color" values="#FF79BF;#49C9EA;#FF2D95;#FF79BF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#49C9EA">
        <animate attributeName="stop-color" values="#49C9EA;#FF2D95;#FF79BF;#49C9EA" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle Glow for Trophy -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#49C9EA;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#FF79BF;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0"/>
    </radialGradient>

    <!-- Glow Filter - Sharpened -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Background Glow -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#49C9EA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Floating Sparkles - Reduced count & opacity -->
  <circle cx="12" cy="7" r="2" fill="#49C9EA" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="215" cy="6" r="2" fill="#FF79BF" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Trophy Glow Background - Subtle -->
  <circle cx="18" cy="22" r="16" fill="url(#goldGlow)">
    <animate attributeName="r" values="15;16;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Trophy Icon with Subtle Pulse -->
  <g filter="url(#glow)">
    <text x="8" y="29" font-size="20">
      🏆
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Text - Static size -->
  <g filter="url(#glow)">
    <text x="38" y="28" font-family="'Georgia', 'Segoe UI', serif" font-size="19" font-weight="700" fill="url(#brandGrad)" letter-spacing="3">
      Achievements
    </text>
  </g>

  <!-- Subtle Underline -->
  <rect x="38" y="35" width="120" height="2.5" fill="url(#brandGrad)" rx="1.5">
    <animate attributeName="width" values="120;116;122;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Dot at end of underline -->
  <circle cx="158" cy="36" r="2.5" fill="#49C9EA" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3.5;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Small Accent Dots -->
  <circle cx="175" cy="10" r="1.5" fill="#FF2D95" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="34" r="1.5" fill="#49C9EA" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Tiny Cyan Accent -->
  <circle cx="222" cy="18" r="1.8" fill="#49C9EA" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle Pulsing Background Glow -->
  <ellipse cx="105" cy="22" rx="110" ry="22" fill="url(#sparkleGrad)" opacity="0.025">
    <animate attributeName="opacity" values="0.015;0.04;0.015" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="110;125;110" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
