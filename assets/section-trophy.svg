<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48">
  <defs>
    <!-- Muted Rose Animated Gradient -->
    <linearGradient id="mutedRoseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C75D74">
        <animate attributeName="stop-color" values="#C75D74;#E6A4B4;#A8556E;#C75D74" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#A8556E">
        <animate attributeName="stop-color" values="#A8556E;#C75D74;#E6A4B4;#A8556E" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#E6A4B4">
        <animate attributeName="stop-color" values="#E6A4B4;#A8556E;#C75D74;#E6A4B4" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Gold Glow for Trophy -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E6A4B4;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#C75D74;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#A8556E;stop-opacity:0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkle Gradient -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E6A4B4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C75D74;stop-opacity:0"/>
    </radialGradient>

    <!-- Star Pattern -->
    <pattern id="starPattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <polygon points="6,1 7.5,4.5 11,4.5 8,6.5 9,10 6,8 3,10 4,6.5 1,4.5 4.5,4.5" fill="#E6A4B4" opacity="0.06">
        <animate attributeName="opacity" values="0.03;0.09;0.03" dur="4s" repeatCount="indefinite"/>
      </polygon>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Star Pattern Background -->
  <rect x="38" y="8" width="190" height="32" fill="url(#starPattern)" rx="4"/>

  <!-- Floating Sparkles -->
  <circle cx="12" cy="7" r="2" fill="#E6A4B4" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="5" r="1.5" fill="#C75D74" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.5;2;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="215" cy="6" r="2" fill="#E6A4B4" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="40" r="1.5" fill="#A8556E" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.5;2;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="4" r="1" fill="#C75D74" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Trophy Glow Background -->
  <circle cx="18" cy="22" r="16" fill="url(#goldGlow)">
    <animate attributeName="r" values="14;18;14" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Trophy Icon with Pulse & Celebration Animation -->
  <g filter="url(#glow)">
    <text x="8" y="29" font-size="20">
      🏆
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0;0,-1;0,0" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Celebration Sparkles Around Trophy -->
  <g opacity="0.5">
    <text x="28" y="10" font-size="6">
      ✨
      <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-2,-3;0,0" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="34" font-size="5">
      ✨
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;2,2;0,0" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="2" y="10" font-size="5">
      ✨
      <animate attributeName="opacity" values="0;0.6;0" dur="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-1,-4;0,0" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Text with Shadow & Pulse -->
  <g filter="url(#glow)">
    <text x="38" y="28" font-family="'Georgia', 'Segoe UI', serif" font-size="19" font-weight="700" fill="url(#mutedRoseGrad)" letter-spacing="3">
      Achievements
      <animate attributeName="font-size" values="19;20.5;19" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="letter-spacing" values="3;4.5;3" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Animated Underline with Gradient -->
  <rect x="38" y="35" width="120" height="2.5" fill="url(#mutedRoseGrad)" rx="1.5">
    <animate attributeName="width" values="120;110;125;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="38;40;38" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Crown/Award at end of underline -->
  <g opacity="0.8">
    <!-- Crown base -->
    <polygon points="158,29 160,33 162,33 164,29 162,29 161,31 159,31 158,29" fill="#E6A4B4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="158,29 160,33 162,33 164,29" fill="none" stroke="#C75D74" stroke-width="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <!-- Crown jewels -->
    <circle cx="159.5" cy="30.5" r="0.8" fill="#A8556E">
      <animate attributeName="r" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="161" cy="30.5" r="0.8" fill="#C75D74">
      <animate attributeName="r" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Achievement Stars Floating -->
  <text x="180" y="14" font-size="9" opacity="0.3">
    ⭐
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <text x="195" y="38" font-size="8" opacity="0.3">
    🎯
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="210" y="20" font-size="8" opacity="0.3">
    💫
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- Small Award Ribbon Dots -->
  <circle cx="170" cy="10" r="1.5" fill="#C75D74" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="34" r="1.5" fill="#A8556E" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Small Heart Decoration -->
  <text x="222" y="18" font-size="10" opacity="0.4">
    🩷
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Pulsing Background Glow -->
  <ellipse cx="105" cy="22" rx="110" ry="22" fill="url(#sparkleGrad)" opacity="0.05">
    <animate attributeName="opacity" values="0.02;0.08;0.02" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="110;125;110" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
