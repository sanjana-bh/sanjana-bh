<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="45" viewBox="0 0 200 45">
  <defs>
    <!-- Brand Palette Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#FF79BF;#49C9EA;#FF2D95" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF79BF">
        <animate attributeName="stop-color" values="#FF79BF;#49C9EA;#FF2D95;#FF79BF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#49C9EA">
        <animate attributeName="stop-color" values="#49C9EA;#FF2D95;#FF79BF;#49C9EA" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter - Sharpened -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Background Glow -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF2D95;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#49C9EA;stop-opacity:0"/>
    </radialGradient>

    <!-- Icon Glow - Subtle -->
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#49C9EA;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Subtle Border Glow -->
  <rect x="1" y="1" width="198" height="43" rx="8" fill="none" stroke="url(#brandGrad)" stroke-opacity="0.12">
    <animate attributeName="stroke-opacity" values="0.08;0.2;0.08" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating Sparkles - Reduced count -->
  <circle cx="10" cy="6" r="1.5" fill="#49C9EA" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="5" r="1.5" fill="#FF79BF" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon Glow Background -->
  <circle cx="15" cy="20" r="12" fill="url(#iconGlow)">
    <animate attributeName="r" values="11;13;11" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Globe Icon - SVG vector (replaces 🌐 emoji) -->
  <g filter="url(#glow)" transform="translate(6,8)">
    <circle cx="10" cy="12" r="8" fill="none" stroke="url(#brandGrad)" stroke-width="1.8"/>
    <ellipse cx="10" cy="12" rx="3" ry="8" fill="none" stroke="url(#brandGrad)" stroke-width="1.2"/>
    <line x1="2" y1="12" x2="18" y2="12" stroke="url(#brandGrad)" stroke-width="1.2"/>
    <line x1="10" y1="4" x2="10" y2="20" stroke="url(#brandGrad)" stroke-width="1.2"/>
    <animateTransform attributeName="transform" type="rotate" values="0 10 12;360 10 12" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- Text - Static size -->
  <g filter="url(#glow)">
    <text x="35" y="27" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="20" font-weight="700" fill="url(#brandGrad)" letter-spacing="3">
      Connect
    </text>
  </g>

  <!-- Subtle Underline -->
  <rect x="35" y="33" width="88" height="2.5" fill="url(#brandGrad)" rx="1.5">
    <animate attributeName="width" values="88;84;92;88" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Node at end of underline -->
  <circle cx="123" cy="34" r="3" fill="none" stroke="#49C9EA" stroke-width="1.5">
    <animate attributeName="r" values="2.5;4;2.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="123" cy="34" r="1.4" fill="#FF79BF">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Connection Lines Animation -->
  <g opacity="0.3">
    <line x1="135" y1="15" x2="148" y2="15" stroke="#FF79BF" stroke-width="1" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="135" y1="20" x2="155" y2="20" stroke="#49C9EA" stroke-width="1" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="135" y1="25" x2="152" y2="25" stroke="#FF2D95" stroke-width="1" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Floating Connection Dots -->
  <circle cx="148" cy="15" r="1.5" fill="#FF79BF">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="20" r="1.5" fill="#49C9EA">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="25" r="1.5" fill="#FF2D95">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Tiny Accent Dot -->
  <circle cx="180" cy="18" r="2" fill="#49C9EA" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2.5;1.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle Pulsing Background Glow -->
  <ellipse cx="80" cy="20" rx="90" ry="20" fill="url(#sparkleGrad)" opacity="0.025">
    <animate attributeName="opacity" values="0.015;0.04;0.015" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="90;100;90" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
