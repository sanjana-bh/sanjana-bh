<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="340" viewBox="0 0 650 340">
  <defs>
    <!-- Updated Brand Palette Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#09090F"/>
      <stop offset="50%" style="stop-color:#11111D"/>
      <stop offset="100%" style="stop-color:#09090F"/>
    </linearGradient>
    
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#171726"/>
      <stop offset="50%" style="stop-color:#09090F"/>
      <stop offset="100%" style="stop-color:#171726"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#FF79BF;#FF2D95" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FF79BF">
        <animate attributeName="stop-color" values="#FF79BF;#49C9EA;#FF79BF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#49C9EA">
        <animate attributeName="stop-color" values="#49C9EA;#FF2D95;#49C9EA" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#49C9EA"/>
      <stop offset="100%" style="stop-color:#FF2D95"/>
    </linearGradient>

    <linearGradient id="glowBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2D95;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#49C9EA;stop-opacity:0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF2D95" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- ===== BACKGROUND WITH GLOW ===== -->
  <rect width="650" height="340" rx="16" ry="16" fill="#09090F"/>
  <rect width="650" height="340" rx="16" ry="16" fill="url(#glowBg)"/>
  
  <!-- ===== TERMINAL WINDOW ===== -->
  <rect x="0" y="0" width="650" height="340" rx="16" ry="16" fill="url(#termBg)" filter="url(#shadow)"/>
  
  <!-- Animated Border Glow -->
  <rect x="1.5" y="1.5" width="647" height="337" rx="14.5" ry="14.5" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- ===== TITLE BAR ===== -->
  <rect x="0" y="0" width="650" height="38" rx="16" ry="16" fill="url(#titleBg)"/>
  <rect x="0" y="26" width="650" height="12" fill="url(#titleBg)"/>
  
  <!-- Window Controls with Pulse -->
  <circle cx="20" cy="19" r="6" fill="#FF2D95">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="19" r="6" fill="#FF79BF">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="19" r="6" fill="#49C9EA">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Terminal Title -->
  <text x="325" y="24" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="12" fill="#9AA4B2" letter-spacing="1">
    sanjana@dev — zsh
  </text>
  
  <!-- ===== DECORATIVE CORNERS ===== -->
  <g opacity="0.3">
    <!-- Top Right -->
    <rect x="615" y="10" width="25" height="2" fill="#FF2D95" rx="1"/>
    <rect x="628" y="10" width="2" height="22" fill="#FF2D95" rx="1"/>
    <!-- Bottom Left -->
    <rect x="10" y="318" width="25" height="2" fill="#FF2D95" rx="1"/>
    <rect x="10" y="308" width="2" height="22" fill="#FF2D95" rx="1"/>
    <!-- Bottom Right -->
    <rect x="615" y="318" width="25" height="2" fill="#FF2D95" rx="1"/>
    <rect x="638" y="308" width="2" height="22" fill="#FF2D95" rx="1"/>
  </g>
  
  <!-- ===== TERMINAL CONTENT ===== -->
  <g font-family="'SF Mono', 'JetBrains Mono', 'Consolas', monospace" font-size="13">
    
    <!-- ===== COMMAND 1 ===== -->
    <text x="20" y="75" fill="#49C9EA" filter="url(#glow)" font-size="14">❯</text>
    <text x="42" y="75" fill="#ECECF4" font-size="13">cat profile.json</text>
    
    <!-- ===== JSON OUTPUT ===== -->
    
    <!-- Opening Brace -->
    <text x="20" y="105" fill="#49C9EA" font-size="13" font-weight="700">{</text>
    
    <!-- Line 1: Name -->
    <text x="35" y="130" fill="#FF79BF" font-size="12">"name"</text>
    <text x="90" y="130" fill="#9AA4B2" font-size="12">:</text>
    <text x="100" y="130" fill="#ECECF4" font-size="12">"Sanjana Bhardwaj"</text>
    <text x="260" y="130" fill="#6B7280" font-size="12">,</text>
    
    <!-- Line 2: Role -->
    <text x="35" y="155" fill="#FF79BF" font-size="12">"role"</text>
    <text x="85" y="155" fill="#9AA4B2" font-size="12">:</text>
    <text x="95" y="155" fill="#ECECF4" font-size="12">"📊 Data Analyst"</text>
    <text x="245" y="155" fill="#6B7280" font-size="12">,</text>
    
    <!-- Line 3: Stack -->
    <text x="35" y="180" fill="#FF79BF" font-size="12">"stack"</text>
    <text x="90" y="180" fill="#9AA4B2" font-size="12">:</text>
    <text x="100" y="180" fill="#ECECF4" font-size="12">"⚛️ MERN · Full-Stack"</text>
    <text x="290" y="180" fill="#6B7280" font-size="12">,</text>
    
    <!-- Line 4: Location -->
    <text x="35" y="205" fill="#FF79BF" font-size="12">"location"</text>
    <text x="115" y="205" fill="#9AA4B2" font-size="12">:</text>
    <text x="125" y="205" fill="#ECECF4" font-size="12">"🇮🇳 India"</text>
    <text x="215" y="205" fill="#6B7280" font-size="12">,</text>
    
    <!-- Line 5: Passion -->
    <text x="35" y="230" fill="#FF79BF" font-size="12">"passion"</text>
    <text x="105" y="230" fill="#9AA4B2" font-size="12">:</text>
    <text x="115" y="230" fill="#49C9EA" font-size="12">"💡 Data &amp; AI"</text>
    <text x="245" y="230" fill="#6B7280" font-size="12">,</text>
    
    <!-- Line 6: Goal -->
    <text x="35" y="255" fill="#FF79BF" font-size="12">"goal"</text>
    <text x="80" y="255" fill="#9AA4B2" font-size="12">:</text>
    <text x="90" y="255" fill="#FF2D95" font-size="12" font-weight="700">"🚀 Build &amp; Innovate"</text>
    
    <!-- Closing Brace -->
    <text x="20" y="280" fill="#49C9EA" font-size="13" font-weight="700">}</text>
    
    <!-- ===== COMMAND 2 ===== -->
    <text x="20" y="308" fill="#49C9EA" filter="url(#glow)" font-size="14">❯</text>
    
    <!-- ===== BLINKING CURSOR ===== -->
    <rect x="42" y="296" width="10" height="17" fill="url(#cursorGrad)" rx="2">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    
    <!-- ===== DECORATIVE DOT ===== -->
    <circle cx="620" cy="308" r="2" fill="#49C9EA" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630" cy="308" r="1.5" fill="#FF2D95" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
