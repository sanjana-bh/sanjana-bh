<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="50" viewBox="0 0 340 50">
  <defs>
    <!-- Brand Palette Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#FF79BF;#49C9EA;#FF2D95" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#FF79BF">
        <animate attributeName="stop-color" values="#FF79BF;#49C9EA;#FF2D95;#FF79BF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" stop-color="#49C9EA">
        <animate attributeName="stop-color" values="#49C9EA;#FF2D95;#FF79BF;#49C9EA" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#FF79BF;#49C9EA;#FF2D95" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter - Sharpened -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Background Glow -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF2D95;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#49C9EA;stop-opacity:0"/>
    </radialGradient>

    <!-- Icon Glow - Subtle -->
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#49C9EA;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Floating Sparkles - Reduced count & opacity -->
  <circle cx="12" cy="8" r="1.5" fill="#49C9EA" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="6" r="1.5" fill="#FF79BF" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="325" cy="42" r="1" fill="#49C9EA" opacity="0.25">
    <animate attributeName="opacity" values="0.10;0.35;0.10" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon Glow Background - Subtle -->
  <circle cx="18" cy="22" r="14" fill="url(#iconGlow)">
    <animate attributeName="r" values="12;14;12" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon with Subtle Float -->
  <g filter="url(#glow)">
    <text x="8" y="29" font-size="20">
      🎮
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-1.5;0,0" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Text - Static size -->
  <g filter="url(#glow)">
    <text x="38" y="28" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="18" font-weight="700" fill="url(#brandGrad)" letter-spacing="2">
      Contribution Showcase
    </text>
  </g>

  <!-- Subtle Underline -->
  <rect x="38" y="35" width="195" height="2.5" fill="url(#brandGrad)" rx="1.5">
    <animate attributeName="width" values="195;191;197;195" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Dot at end of underline -->
  <circle cx="233" cy="36" r="2.5" fill="#49C9EA" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Small Accent Dots -->
  <circle cx="260" cy="10" r="1.5" fill="#FF79BF" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;1.8;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="38" r="1.5" fill="#49C9EA" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;1.8;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Tiny Cyan Accent -->
  <circle cx="315" cy="18" r="1.8" fill="#49C9EA" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle Pulsing Background Glow -->
  <ellipse cx="130" cy="22" rx="150" ry="22" fill="url(#sparkleGrad)" opacity="0.025">
    <animate attributeName="opacity" values="0.015;0.04;0.015" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="150;160;150" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
