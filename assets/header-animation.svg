<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <!-- Soft Rose Gradient -->
    <linearGradient id="softRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C75D74">
        <animate attributeName="stop-color" values="#C75D74;#E6A4B4;#C75D74" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#E6A4B4">
        <animate attributeName="stop-color" values="#E6A4B4;#C75D74;#E6A4B4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#A8556E">
        <animate attributeName="stop-color" values="#A8556E;#E6A4B4;#A8556E" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1E1B2E"/>
      <stop offset="100%" style="stop-color:#0F0A1A"/>
    </radialGradient>

    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C75D74" flood-opacity="0.2"/>
    </filter>

    <!-- Sparkle Star -->
    <g id="star">
      <polygon points="0,-6 1.8,-1.8 6,0 1.8,1.8 0,6 -1.8,1.8 -6,0 -1.8,-1.8" fill="#E6A4B4" opacity="0.6"/>
    </g>

    <!-- Flower Petal -->
    <g id="flower">
      <circle cx="0" cy="-5" r="3" fill="#E6A4B4" opacity="0.5"/>
      <circle cx="4.7" cy="-1.5" r="3" fill="#C75D74" opacity="0.5"/>
      <circle cx="2.9" cy="4" r="3" fill="#E6A4B4" opacity="0.5"/>
      <circle cx="-2.9" cy="4" r="3" fill="#C75D74" opacity="0.5"/>
      <circle cx="-4.7" cy="-1.5" r="3" fill="#E6A4B4" opacity="0.5"/>
      <circle cx="0" cy="0" r="2" fill="#FFF" opacity="0.6"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Decorative Blobs -->
  <circle cx="100" cy="50" r="80" fill="#C75D74" opacity="0.05">
    <animateTransform attributeName="transform" type="translate" values="0,0;10,-10;0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="180" r="100" fill="#E6A4B4" opacity="0.05">
    <animateTransform attributeName="transform" type="translate" values="0,0;-10,10;0,0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="110" r="120" fill="#A8556E" opacity="0.03">
    <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Flowers -->
  <use href="#flower" x="100" y="40">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4s" repeatCount="indefinite"/>
  </use>
  <use href="#flower" x="780" y="180">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="3.8s" repeatCount="indefinite"/>
  </use>
  <use href="#flower" x="150" y="180">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="4.5s" repeatCount="indefinite"/>
  </use>
  <use href="#flower" x="750" y="35">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.5s" repeatCount="indefinite"/>
  </use>

  <!-- Floating Stars -->
  <use href="#star" x="60" y="90">
    <animateTransform attributeName="transform" type="rotate" from="0 60 90" to="360 60 90" dur="6s" repeatCount="indefinite"/>
  </use>
  <use href="#star" x="840" y="100">
    <animateTransform attributeName="transform" type="rotate" from="0 840 100" to="-360 840 100" dur="7s" repeatCount="indefinite"/>
  </use>
  <use href="#star" x="200" y="160">
    <animateTransform attributeName="transform" type="rotate" from="0 200 160" to="360 200 160" dur="5s" repeatCount="indefinite"/>
  </use>
  <use href="#star" x="700" y="150">
    <animateTransform attributeName="transform" type="rotate" from="0 700 150" to="-360 700 150" dur="6.5s" repeatCount="indefinite"/>
  </use>

  <!-- Decorative Top Border -->
  <path d="M0,5 Q225,15 450,5 Q675,-5 900,5" fill="none" stroke="url(#softRose)" stroke-width="1.5" opacity="0.4">
    <animate attributeName="d" values="M0,5 Q225,15 450,5 Q675,-5 900,5;M0,5 Q225,-5 450,5 Q675,15 900,5;M0,5 Q225,15 450,5 Q675,-5 900,5" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Name with Shadow -->
  <g filter="url(#shadow)">
    <!-- Name Background Glow -->
    <text x="450" y="90" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="48" font-weight="700" fill="url(#softRose)" letter-spacing="6" filter="url(#glow)" opacity="0.3">
      SANJANA BHARDWAJ
    </text>
    
    <!-- Main Name -->
    <text x="450" y="85" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="48" font-weight="700" fill="url(#softRose)" letter-spacing="6">
      SANJANA BHARDWAJ
    </text>
  </g>

  <!-- Elegant Underline with Diamond -->
  <g opacity="0.7">
    <rect x="200" y="100" width="500" height="2" fill="url(#softRose)" rx="1">
      <animate attributeName="width" values="500;450;500" dur="5s" repeatCount="indefinite"/>
    </rect>
    <polygon points="450,102 456,110 450,118 444,110" fill="#E6A4B4" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Titles -->
  <text x="450" y="148" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="16" fill="#E6A4B4" letter-spacing="5" font-weight="300">
    📊 DATA ANALYST
  </text>

  <text x="450" y="174" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="13" fill="#A8A4B8" letter-spacing="4" font-weight="300">
    ⚛️ MERN STACK DEVELOPER  ✦  💻 SOFTWARE DEVELOPER
  </text>

  <!-- Decorative Lines -->
  <g opacity="0.3">
    <line x1="130" y1="164" x2="300" y2="164" stroke="url(#softRose)" stroke-width="1" stroke-linecap="round">
      <animate attributeName="x2" values="130;300;130" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="164" x2="770" y2="164" stroke="url(#softRose)" stroke-width="1" stroke-linecap="round">
      <animate attributeName="x1" values="770;600;770" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Bottom Decorative Dots -->
  <g opacity="0.4">
    <circle cx="380" cy="195" r="2" fill="#C75D74">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="195" r="1.5" fill="#E6A4B4">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="195" r="2" fill="#A8556E">
      <animate attributeName="r" values="2;3;2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="195" r="1.5" fill="#E6A4B4">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="195" r="2" fill="#C75D74">
      <animate attributeName="r" values="2;3;2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="195" r="1.5" fill="#A8556E">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="195" r="2" fill="#E6A4B4">
      <animate attributeName="r" values="2;3;2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="195" r="1.5" fill="#C75D74">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom Wave Border -->
  <path d="M0,215 Q225,205 450,215 Q675,225 900,215" fill="none" stroke="url(#softRose)" stroke-width="1.5" opacity="0.4">
    <animate attributeName="d" values="M0,215 Q225,205 450,215 Q675,225 900,215;M0,215 Q225,225 450,215 Q675,205 900,215;M0,215 Q225,205 450,215 Q675,225 900,215" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
