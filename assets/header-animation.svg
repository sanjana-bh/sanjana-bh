<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <!-- Subtle Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#C9788E;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#0B1220;stop-opacity:0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3A8B7"/>
      <stop offset="50%" style="stop-color:#C9788E"/>
      <stop offset="100%" style="stop-color:#E3A8B7">
        <animate attributeName="stop-color" values="#E3A8B7;#C9788E;#E3A8B7" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="#0B1220"/>
  <rect width="900" height="220" fill="url(#glow)"/>

  <!-- Top Line -->
  <rect x="80" y="0" width="740" height="1" fill="#D49AAA" opacity="0.12"/>

  <!-- Main Name -->
  <text x="450" y="72" text-anchor="middle" font-family="'Playfair Display', 'Georgia', serif" font-size="46" font-weight="700" fill="url(#nameGrad)" letter-spacing="4">
    Sanjana Bhardwaj
  </text>

  <!-- Underline -->
  <rect x="280" y="86" width="340" height="2" fill="#C9788E" rx="1" opacity="0.3">
    <animate attributeName="width" values="0;340" dur="0.8s" fill="freeze"/>
  </rect>

  <!-- Title 1: DATA ANALYST -->
  <text x="450" y="128" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#E3A8B7" letter-spacing="8">
    DATA ANALYST
  </text>

  <!-- Title 2: MERN + Software Developer -->
  <text x="450" y="155" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="300" fill="#94A3B8" letter-spacing="3">
    MERN STACK DEVELOPER  ✦  SOFTWARE DEVELOPER
  </text>

  <!-- Bottom Line -->
  <rect x="80" y="195" width="740" height="1" fill="#D49AAA" opacity="0.12"/>

  <!-- Bottom Row -->
  <text x="320" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="300" fill="#94A3B8" letter-spacing="2">
    MUMBAI, INDIA
  </text>

  <!-- Open to Work -->
  <rect x="525" y="200" width="110" height="20" rx="10" ry="10" fill="#C9788E" opacity="0.1"/>
  <text x="580" y="214" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#C9788E" letter-spacing="2">
    OPEN TO WORK
  </text>

  <!-- Small dots -->
  <circle cx="520" cy="210" r="1.5" fill="#E3A8B7" opacity="0.15"/>
  <circle cx="645" cy="210" r="1.5" fill="#E3A8B7" opacity="0.15"/>
</svg>
