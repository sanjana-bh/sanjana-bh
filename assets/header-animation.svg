<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A2A3A" stroke-width="0.3" opacity="0.3"/>
    </pattern>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D95"/>
      <stop offset="50%" style="stop-color:#FF2D95"/>
      <stop offset="100%" style="stop-color:#FF73B8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="#0B0B14"/>

  <!-- Card Background -->
  <rect x="20" y="10" width="860" height="200" rx="4" ry="4" fill="#11111D"/>

  <!-- Grid overlay -->
  <rect x="20" y="10" width="860" height="200" rx="4" ry="4" fill="url(#grid)"/>

  <!-- Top Border -->
  <rect x="40" y="10" width="820" height="1" fill="#2A2A3A" opacity="0.5"/>

  <!-- Corner brackets -->
  <path d="M50 28 L50 18 L60 18" fill="none" stroke="#4DD7F3" stroke-width="1.2" opacity="0.4"/>
  <path d="M850 28 L850 18 L840 18" fill="none" stroke="#4DD7F3" stroke-width="1.2" opacity="0.4"/>
  <path d="M50 192 L50 202 L60 202" fill="none" stroke="#4DD7F3" stroke-width="1.2" opacity="0.4"/>
  <path d="M850 192 L850 202 L840 202" fill="none" stroke="#4DD7F3" stroke-width="1.2" opacity="0.4"/>

  <!-- Main Name - Primary #FF2D95 -->
  <text x="450" y="68" text-anchor="middle" font-family="'Orbitron', 'Rajdhani', 'Arial', sans-serif" font-size="38" font-weight="900" fill="#FF2D95" letter-spacing="8">
    SANJANA BHARDWAJ
  </text>

  <!-- Divider line -->
  <rect x="280" y="80" width="340" height="1" fill="#41304A" opacity="0.6">
    <animate attributeName="width" values="0;340" dur="0.8s" fill="freeze"/>
  </rect>

  <!-- Cyan accent line -->
  <rect x="280" y="82" width="60" height="1.5" fill="#4DD7F3" opacity="0.5">
    <animate attributeName="width" values="0;60" dur="1s" fill="freeze"/>
    <animate attributeName="x" values="280;560" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Title 1: DATA ANALYST - Secondary #FF73B8 -->
  <text x="450" y="122" text-anchor="middle" font-family="'Rajdhani', 'Arial', sans-serif" font-size="14" font-weight="600" fill="#FF73B8" letter-spacing="12">
    DATA ANALYST
  </text>

  <!-- Separator -->
  <text x="450" y="142" text-anchor="middle" font-family="'Rajdhani', monospace" font-size="8" fill="#4DD7F3" letter-spacing="6" opacity="0.4">
    ✦ ✦ ✦
  </text>

  <!-- Title 2: MERN + Software Developer - Secondary Text #B3B8C7 -->
  <text x="450" y="162" text-anchor="middle" font-family="'Rajdhani', 'Arial', sans-serif" font-size="11" font-weight="400" fill="#B3B8C7" letter-spacing="5">
    MERN STACK DEVELOPER  //  SOFTWARE DEVELOPER
  </text>

  <!-- Bottom Divider -->
  <rect x="40" y="185" width="820" height="1" fill="#41304A" opacity="0.4"/>

  <!-- Location - Muted Text #7C8396 -->
  <text x="310" y="200" text-anchor="middle" font-family="'Rajdhani', 'Arial', sans-serif" font-size="10" font-weight="300" fill="#7C8396" letter-spacing="4">
    &lt; MUMBAI, INDIA /&gt;
  </text>

  <!-- Open to Work - Success #22C55E -->
  <rect x="525" y="190" width="118" height="20" rx="2" ry="2" fill="none" stroke="#22C55E" stroke-width="0.8" opacity="0.4"/>
  <rect x="525" y="190" width="118" height="20" rx="2" ry="2" fill="#22C55E" opacity="0.06"/>
  <text x="584" y="204" text-anchor="middle" font-family="'Rajdhani', 'Arial', sans-serif" font-size="9" font-weight="500" fill="#22C55E" letter-spacing="3">
    [ OPEN TO WORK ]
  </text>

  <!-- Decorative dots -->
  <circle cx="492" cy="200" r="1.2" fill="#4DD7F3" opacity="0.25"/>
  <circle cx="658" cy="200" r="1.2" fill="#4DD7F3" opacity="0.25"/>

  <!-- Bottom Border -->
  <rect x="40" y="210" width="820" height="1" fill="#2A2A3A" opacity="0.3"/>
</svg>
