<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1166" height="184" viewBox="0 0 1166 184">
  <desc>Snake Contribution Graph - Cyber Pink + Cyan Theme for Sanjana Bhardwaj</desc>
  
  <rect width="100%" height="100%" fill="#0D1117"/>

  <!-- Month Labels -->
  <g fill="#9AA4B2" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">
    <text x="10" y="10">Jan</text>
    <text x="98" y="10">Feb</text>
    <text x="186" y="10">Mar</text>
    <text x="296" y="10">Apr</text>
    <text x="384" y="10">May</text>
    <text x="472" y="10">Jun</text>
    <text x="582" y="10">Jul</text>
    <text x="670" y="10">Aug</text>
    <text x="780" y="10">Sep</text>
    <text x="868" y="10">Oct</text>
    <text x="956" y="10">Nov</text>
    <text x="1066" y="10">Dec</text>
    <text x="1154" y="10">Jan</text>
  </g>

  <!-- Legend -->
  <g transform="translate(450, 175)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#9AA4B2">Less</text>
    <rect x="30" y="-6" width="10" height="10" rx="2" fill="#1E293B"/>
    <rect x="44" y="-6" width="10" height="10" rx="2" fill="#67E8F9" opacity="0.4"/>
    <rect x="58" y="-6" width="10" height="10" rx="2" fill="#F472B6" opacity="0.6"/>
    <rect x="72" y="-6" width="10" height="10" rx="2" fill="#EC4899" opacity="0.8"/>
    <rect x="86" y="-6" width="10" height="10" rx="2" fill="#FF2D95"/>
    <text x="110" y="0" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#9AA4B2">More</text>
  </g>

  <defs>
    <!-- Cyber Gradient -->
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#67E8F9"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#FF2D95"/>
    </linearGradient>

    <!-- Snake Glow Filter -->
    <filter id="snakeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Cell Glow -->
    <filter id="cellGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Week 1: Empty -->
  <rect x="0" y="15" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="0" y="37" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="0" y="59" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="0" y="81" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="0" y="103" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="0" y="125" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="0" y="147" width="20" height="20" rx="4" fill="#1E293B"/>

  <!-- Week 2: Low (Cyan) -->
  <rect x="22" y="15" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="22" y="37" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="22" y="59" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="22" y="81" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="22" y="103" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="22" y="125" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="22" y="147" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>

  <!-- Week 3: Medium (Pink) -->
  <rect x="44" y="15" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="44" y="37" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="44" y="59" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="44" y="81" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="44" y="103" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="44" y="125" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="44" y="147" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>

  <!-- Week 4: High (Hot Pink) -->
  <rect x="66" y="15" width="20" height="20" rx="4" fill="#EC4899" opacity="0.8"/>
  <rect x="66" y="37" width="20" height="20" rx="4" fill="#EC4899" opacity="0.8"/>
  <rect x="66" y="59" width="20" height="20" rx="4" fill="#EC4899" opacity="0.8"/>
  <rect x="66" y="81" width="20" height="20" rx="4" fill="#EC4899" opacity="0.8"/>
  <rect x="66" y="103" width="20" height="20" rx="4" fill="#EC4899" opacity="0.8"/>
  <rect x="66" y="125" width="20" height="20" rx="4" fill="#EC4899" opacity="0.8"/>
  <rect x="66" y="147" width="20" height="20" rx="4" fill="#EC4899" opacity="0.8"/>

  <!-- Week 5: Highest (Neon Pink) -->
  <rect x="88" y="15" width="20" height="20" rx="4" fill="#FF2D95"/>
  <rect x="88" y="37" width="20" height="20" rx="4" fill="#FF2D95"/>
  <rect x="88" y="59" width="20" height="20" rx="4" fill="#FF2D95"/>
  <rect x="88" y="81" width="20" height="20" rx="4" fill="#FF2D95"/>
  <rect x="88" y="103" width="20" height="20" rx="4" fill="#FF2D95"/>
  <rect x="88" y="125" width="20" height="20" rx="4" fill="#FF2D95"/>
  <rect x="88" y="147" width="20" height="20" rx="4" fill="#FF2D95"/>

  <!-- Week 6: Empty -->
  <rect x="110" y="15" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="110" y="37" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="110" y="59" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="110" y="81" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="110" y="103" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="110" y="125" width="20" height="20" rx="4" fill="#1E293B"/>
  <rect x="110" y="147" width="20" height="20" rx="4" fill="#1E293B"/>

  <!-- Week 7: Low (Cyan) -->
  <rect x="132" y="15" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="132" y="37" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="132" y="59" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="132" y="81" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="132" y="103" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="132" y="125" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>
  <rect x="132" y="147" width="20" height="20" rx="4" fill="#67E8F9" opacity="0.35"/>

  <!-- Week 8: Medium (Pink) -->
  <rect x="154" y="15" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="154" y="37" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="154" y="59" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="154" y="81" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="154" y="103" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="154" y="125" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>
  <rect x="154" y="147" width="20" height="20" rx="4" fill="#F472B6" opacity="0.55"/>

  <!-- Snake - Animated pattern with glow -->
  <rect x="176" y="15" width="20" height="20" rx="4" fill="#67E8F9" filter="url(#cellGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="176" y="37" width="20" height="20" rx="4" fill="#F472B6" filter="url(#cellGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="176" y="59" width="20" height="20" rx="4" fill="#EC4899" filter="url(#cellGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="176" y="81" width="20" height="20" rx="4" fill="#FF2D95" filter="url(#snakeGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="176" y="103" width="20" height="20" rx="4" fill="#67E8F9" filter="url(#cellGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="176" y="125" width="20" height="20" rx="4" fill="#F472B6" filter="url(#cellGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="176" y="147" width="20" height="20" rx="4" fill="#EC4899" filter="url(#cellGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Gradient line separator -->
  <rect x="50" y="170" width="1066" height="1" fill="url(#snakeGrad)" opacity="0.15" rx="0.5"/>
</svg>
