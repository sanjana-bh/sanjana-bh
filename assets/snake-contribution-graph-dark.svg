<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1166" height="184" viewBox="0 0 1166 184">
  <desc>Snake Contribution Graph - Muted Rose Theme for Sanjana Bhardwaj</desc>
  
  <rect width="100%" height="100%" fill="#0F172A"/>

  <!-- Month Labels -->
  <g fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">
    <text x="10" y="10">Jan</text>
    <text x="98" y="10">Feb</text>
    <text x="186" y="10">Mar</text>
    <text x="296" y="10">Apr</text>
    <text x="384" y="10">May</text>
    <text x="472" y="10">Jun</text>
    <text x="582" y="10">Jul</text>
    <text x="670" y="10">Aug</text>
    <text x="780" y="10">Sep</text>
    <text x="868" y="10">Oct</text>
    <text x="956" y="10">Nov</text>
    <text x="1066" y="10">Dec</text>
    <text x="1154" y="10">Jan</text>
  </g>

  <!-- Legend -->
  <text x="450" y="175" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94A3B8">
    Less  🩷  🩷  🩷  More
  </text>

  <defs>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9788E"/>
      <stop offset="50%" style="stop-color:#D49AAA"/>
      <stop offset="100%" style="stop-color:#E3A8B7"/>
    </linearGradient>
  </defs>

  <!-- Color Mapping: Empty → #111827, Low → #C9788E, Med → #D49AAA, High → #E3A8B7 -->
  
  <!-- Generate all weeks with proper colors -->
  
  <!-- Week 1: Empty -->
  <rect x="0" y="15" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="0" y="37" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="0" y="59" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="0" y="81" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="0" y="103" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="0" y="125" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="0" y="147" width="20" height="20" rx="4" fill="#111827"/>

  <!-- Week 2: Low -->
  <rect x="22" y="15" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="22" y="37" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="22" y="59" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="22" y="81" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="22" y="103" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="22" y="125" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="22" y="147" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>

  <!-- Week 3: Medium -->
  <rect x="44" y="15" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="44" y="37" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="44" y="59" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="44" y="81" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="44" y="103" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="44" y="125" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="44" y="147" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>

  <!-- Week 4-6: High -->
  <rect x="66" y="15" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="66" y="37" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="66" y="59" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="66" y="81" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="66" y="103" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="66" y="125" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="66" y="147" width="20" height="20" rx="4" fill="#E3A8B7"/>

  <rect x="88" y="15" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="88" y="37" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="88" y="59" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="88" y="81" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="88" y="103" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="88" y="125" width="20" height="20" rx="4" fill="#E3A8B7"/>
  <rect x="88" y="147" width="20" height="20" rx="4" fill="#E3A8B7"/>

  <!-- Continue pattern... -->
  <rect x="110" y="15" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="110" y="37" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="110" y="59" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="110" y="81" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="110" y="103" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="110" y="125" width="20" height="20" rx="4" fill="#111827"/>
  <rect x="110" y="147" width="20" height="20" rx="4" fill="#111827"/>

  <rect x="132" y="15" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="132" y="37" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="132" y="59" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="132" y="81" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="132" y="103" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="132" y="125" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>
  <rect x="132" y="147" width="20" height="20" rx="4" fill="#C9788E" opacity="0.4"/>

  <rect x="154" y="15" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="154" y="37" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="154" y="59" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="154" y="81" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="154" y="103" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="154" y="125" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>
  <rect x="154" y="147" width="20" height="20" rx="4" fill="#D49AAA" opacity="0.6"/>

  <!-- Snake - Animated pattern -->
  <rect x="176" y="15" width="20" height="20" rx="4" fill="#C9788E">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="176" y="37" width="20" height="20" rx="4" fill="#D49AAA">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="176" y="59" width="20" height="20" rx="4" fill="#E3A8B7">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Heart and rose decorations -->
  <text x="1140" y="170" font-size="14" fill="#E3A8B7" opacity="0.4">🩷</text>
  <text x="20" y="170" font-size="12" fill="#C9788E" opacity="0.3">🌸</text>
  
  <!-- Gradient line separator -->
  <rect x="50" y="170" width="1066" height="1" fill="url(#snakeGrad)" opacity="0.1" rx="0.5"/>
</svg>
