    <text x="110" y="0" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#8B949E">More</text>
  </g>

  <defs>
    <!-- Snake Glow Filter -->
    <filter id="snakeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

