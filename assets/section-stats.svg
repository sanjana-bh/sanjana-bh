<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="45" viewBox="0 0 220 45">
  <defs>
    <!-- Animated Rose Gradient -->
    <linearGradient id="sectionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9788E">
        <animate attributeName="stop-color" values="#C9788E;#E3A8B7;#C9788E" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#E3A8B7">
        <animate attributeName="stop-color" values="#E3A8B7;#C9788E;#E3A8B7" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkle Gradient -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E3A8B7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C9788E;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Floating Sparkles -->
  <circle cx="10" cy="6" r="1.5" fill="#E3A8B7" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="4" r="1" fill="#C9788E" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="5" r="1.5" fill="#E3A8B7" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="212" cy="38" r="1" fill="#C9788E" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon Glow Background -->
  <circle cx="16" cy="22" r="12" fill="url(#sparkleGrad)">
    <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon with Pulse -->
  <g filter="url(#glow)">
    <text x="6" y="27" font-size="18">
      📊
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Text with Shadow & Pulse -->
  <g filter="url(#glow)">
    <text x="35" y="27" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="url(#sectionGrad)" letter-spacing="2">
      GitHub Analytics
      <animate attributeName="font-size" values="18;19;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="letter-spacing" values="2;3;2" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Animated Underline -->
  <rect x="35" y="33" width="140" height="2.5" fill="url(#sectionGrad)" rx="1.5">
    <animate attributeName="width" values="140;130;145;140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="35;37;35" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Dot at end of underline -->
  <circle cx="175" cy="34" r="2.5" fill="#E3A8B7" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3.5;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing Background Glow -->
  <ellipse cx="95" cy="20" rx="100" ry="20" fill="url(#sparkleGrad)" opacity="0.05">
    <animate attributeName="opacity" values="0.02;0.08;0.02" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="100;110;100" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
