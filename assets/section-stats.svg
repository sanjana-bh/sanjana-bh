<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="45" viewBox="0 0 220 45">
  <defs>
    <!-- Brand Palette Gradient -->
    <linearGradient id="sectionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#FF79BF;#49C9EA;#FF2D95" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FF79BF">
        <animate attributeName="stop-color" values="#FF79BF;#49C9EA;#FF2D95;#FF79BF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#49C9EA">
        <animate attributeName="stop-color" values="#49C9EA;#FF2D95;#FF79BF;#49C9EA" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter - Sharpened -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Background Glow -->
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF2D95;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#49C9EA;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Floating Sparkles - Reduced count & opacity -->
  <circle cx="10" cy="6" r="1.5" fill="#49C9EA" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="5" r="1.5" fill="#FF79BF" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;2;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon Glow Background - Subtle -->
  <circle cx="16" cy="22" r="12" fill="url(#sparkleGrad)">
    <animate attributeName="r" values="11;12;11" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.35;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon with Pulse -->
  <g filter="url(#glow)">
    <text x="6" y="27" font-size="18">
      📊
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Text - Static size -->
  <g filter="url(#glow)">
    <text x="35" y="27" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="url(#sectionGrad)" letter-spacing="2">
      GitHub Analytics
    </text>
  </g>

  <!-- Subtle Underline -->
  <rect x="35" y="33" width="140" height="2.5" fill="url(#sectionGrad)" rx="1.5">
    <animate attributeName="width" values="140;136;143;140" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Dot at end of underline -->
  <circle cx="175" cy="34" r="2.5" fill="#49C9EA" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3.5;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle Pulsing Background Glow -->
  <ellipse cx="95" cy="20" rx="100" ry="20" fill="url(#sparkleGrad)" opacity="0.025">
    <animate attributeName="opacity" values="0.015;0.04;0.015" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="100;110;100" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
